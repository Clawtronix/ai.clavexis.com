<!doctype html>
<html lang="en">
<head>
<meta name="cx-api" content="https://api.clavexis.com">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClavexisAI — Legal</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/site.css">
</head>
<body>
<main class="page"><div class="wrap"><article class="legal" id="doc"><p class="muted">Loading…</p></article>
  <p class="dim small mt" id="stamp"></p></div></main>
<script src="/js/site.js"></script>
<script>
(async function () {
  await CX.chrome();
  const doc = location.pathname.replace(/\//g, '').replace(/\.html$/, '') || 'terms';   // /eula and /eula.html (GitHub Pages)
  const titles = { eula: 'Licence agreement', terms: 'Terms of sale', privacy: 'Privacy policy', refunds: 'Refund policy' };
  document.title = (titles[doc] || 'Legal') + ' — ClavexisAI';
  try {
    const d = await CX.api('/api/legal/' + doc);
    document.getElementById('doc').innerHTML = CX.md(d.text);
    if (d.sha256) document.getElementById('stamp').textContent = `Version ${d.version} · SHA-256 ${d.sha256}`;
  } catch (e) { document.getElementById('doc').innerHTML = '<h1>Not found</h1>'; }
})();
</script>
</body>
</html>
